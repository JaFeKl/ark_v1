[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ark_v1"
version = "1.0.0"
description = "ARK-V1 is an LLM-Agent which performs reasoning on a knowledge graph."
authors = [
    { name = "Jan-Felix Klein", email = "janfelixklein@ooglemail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
  "pydantic>=2.11,<3",
  "langchain>=1.1.0,<2",
  "langchain_ollama>=1.0.0,<2",
  "langgraph>=1.0.0,<2",
  "langchain-openai>=1.1.7,<2",
  "langfuse>=4,<5",
  "python-dotenv>=1,<2",
   "transformers>=4.50.3",
   "networkx>=3.4.2",
   "sentence-transformers>=5.0.0",
   "faiss-cpu>=1.11.0"
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ark_v1*"]

